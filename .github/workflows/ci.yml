name: Reinforcement Learning CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/python-version@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify python scripts compilation
      run: |
        python -m py_compile main.py
        python -m py_compile compare_algorithms.py
        python -m py_compile deep_q_learning/lunar_lander_dqn.py
        python -m py_compile qlearning/lunar_lander_qlearning.py
        python -m py_compile sarsa/lunar_lander_sarsa.py
        python -m py_compile monte_carlo/lunar_lander_monte_carlo.py
        python -m py_compile cross_entropy/cem_lunar_lander.py

    - name: Run Benchmark Analysis Check
      run: |
        python compare_algorithms.py
